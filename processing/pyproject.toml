[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "red-otus-pipeline"
# PEP 440 omite el prefijo visual "v" usado por la aplicación.
version = "2026.1.0"
description = "Procesador Silver/Gold para el Dashboard Red OTUS"
authors = [
  { name = "Cristian C. Acevedo" },
]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.24",
  "geopandas>=0.14",
  "shapely>=2.0",
  "psutil>=5.9",
  "Pillow>=10,<13",
  "PySide6>=6.8,<7",
  "paramiko>=5.1,<6",
]

[project.scripts]
red-otus-process = "red_otus_pipeline.cli:main"
red-otus-gui = "red_otus_pipeline.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["red_otus_pipeline*"]

[tool.setuptools.package-data]
red_otus_pipeline = ["resources/*.qss", "resources/*.svg"]
