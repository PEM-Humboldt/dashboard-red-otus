name: Pruebas del pipeline

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: processing/requirements.lock.txt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r processing/requirements.lock.txt
          python -m pip install -e processing --no-deps
          python -m pip check

      - name: Ejecutar pruebas automatizadas
        shell: pwsh
        run: python -m unittest discover -s processing/tests -v
